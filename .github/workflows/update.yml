name: Cron Timezone Debugger

on:
  schedule:
    - cron: '15 * * * *'  # 매시간 15분마다 실행 테스트
  workflow_dispatch:

jobs:
  debug-time:
    runs-on: ubuntu-latest
    steps:
      - name: Print Time Debug Logs
        run: |
          echo "=== GitHub Actions 스케줄러 디버그 로그 ==="
          echo "트리거 종류: ${{ github.event_name }}"
          echo "발동된 Cron 식: ${{ github.event.schedule }}"
          echo "현재 UTC 시간: $(date -u)"
          echo "현재 KST 시간 (한국): $(TZ='Asia/Seoul' date)"
